<svg width="100%" viewBox="0 0 680 310" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The password stops at the dev server; the browser and the agent only get the session</title>
<desc>You type the password once into the OS credential store. The dev server reads it, logs in against the backend from Node, and gets a session token back. It injects only the token into the page. The coding agent opens localhost and types nothing.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.t{font-size:14px;font-weight:600}
.s{font-size:12.5px;fill:#C3C9D3}
.leg{font-size:12.5px;fill:#C3C9D3}
.note{font-size:12.5px;fill:#C3C9D3}
.amber-note{font-size:12.5px;fill:#F2C879}
.teal-note{font-size:12.5px;fill:#8FE3C4}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.amber-r{fill:#3A2A10;stroke:#D9A14A;stroke-width:1}
.gray-t{fill:#E1E4EA}.teal-t{fill:#8FE3C4}.amber-t{fill:#F2C879}
.e-gray{stroke:#8B93A1;stroke-width:1.25;fill:none}
.e-amber{stroke:#D9A14A;stroke-width:1.25;fill:none}
.e-teal{stroke:#34B38A;stroke-width:1.25;fill:none}
</style>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B93A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D9A14A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#34B38A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="amber-r" x="8" y="10" width="12" height="12" rx="2"/><text class="leg" x="26" y="20">holds the password</text>
<rect class="teal-r" x="168" y="10" width="12" height="12" rx="2"/><text class="leg" x="186" y="20">holds only the session</text>
<rect class="gray-r" x="340" y="10" width="12" height="12" rx="2"/><text class="leg" x="358" y="20">holds neither</text>

<rect class="amber-r" x="8" y="44" width="136" height="76" rx="8"/>
<text class="t amber-t" x="76" y="68" text-anchor="middle">You, once</text>
<text class="s" x="76" y="88" text-anchor="middle">typed into your own</text>
<text class="s" x="76" y="104" text-anchor="middle">terminal, no echo</text>

<rect class="amber-r" x="180" y="44" width="144" height="76" rx="8"/>
<text class="t amber-t" x="252" y="68" text-anchor="middle">OS credential store</text>
<text class="s" x="252" y="88" text-anchor="middle">Keychain and its</text>
<text class="s" x="252" y="104" text-anchor="middle">Windows, Linux cousins</text>

<rect class="amber-r" x="360" y="44" width="140" height="76" rx="8"/>
<text class="t amber-t" x="430" y="68" text-anchor="middle">Dev server</text>
<text class="s" x="430" y="88" text-anchor="middle">logs in from Node</text>
<text class="teal-note" x="430" y="104" text-anchor="middle">caches the session</text>

<rect class="teal-r" x="536" y="44" width="136" height="76" rx="8"/>
<text class="t teal-t" x="604" y="68" text-anchor="middle">Browser</text>
<text class="s" x="604" y="88" text-anchor="middle">token set before</text>
<text class="s" x="604" y="104" text-anchor="middle">the app boots</text>

<line class="e-amber" x1="144" y1="82" x2="177" y2="82" marker-end="url(#ma)"/>
<line class="e-amber" x1="324" y1="82" x2="357" y2="82" marker-end="url(#ma)"/>
<line class="e-teal" x1="500" y1="82" x2="533" y2="82" marker-end="url(#mt)"/>

<rect class="gray-r" x="360" y="200" width="140" height="64" rx="8"/>
<text class="t gray-t" x="430" y="224" text-anchor="middle">Backend</text>
<text class="s" x="430" y="244" text-anchor="middle">the form's login API</text>

<line class="e-amber" x1="412" y1="120" x2="412" y2="197" marker-end="url(#ma)"/>
<text class="amber-note" x="404" y="164" text-anchor="end">login</text>
<line class="e-teal" x1="448" y1="200" x2="448" y2="123" marker-end="url(#mt)"/>
<text class="teal-note" x="456" y="164">token</text>

<rect class="gray-r" x="536" y="200" width="136" height="64" rx="8"/>
<text class="t gray-t" x="604" y="224" text-anchor="middle">Coding agent</text>
<text class="s" x="604" y="244" text-anchor="middle">opens localhost</text>
<line class="e-gray" x1="604" y1="200" x2="604" y2="123" marker-end="url(#mg)"/>

<text class="note" x="340" y="296" text-anchor="middle">The password stops at the dev server. The browser and the agent only ever see the session.</text>
</svg>
