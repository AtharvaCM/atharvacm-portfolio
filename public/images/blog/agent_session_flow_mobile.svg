<svg width="100%" viewBox="0 0 344 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The password stops at the dev server; the browser and the agent only get the session</title>
<desc>You type the password once into the OS credential store. The dev server reads it, logs in against the backend from Node, and gets a session token back. It injects only the token into the page. The coding agent opens localhost and types nothing.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.t{font-size:15px;font-weight:600}
.s{font-size:14px;fill:#C3C9D3}
.leg{font-size:13px;fill:#C3C9D3}
.note{font-size:14px;fill:#C3C9D3}
.teal-note{font-size:14px;fill:#8FE3C4}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.amber-r{fill:#3A2A10;stroke:#D9A14A;stroke-width:1}
.gray-t{fill:#E1E4EA}.teal-t{fill:#8FE3C4}.amber-t{fill:#F2C879}
.e-gray{stroke:#8B93A1;stroke-width:1.25;fill:none}
.e-amber{stroke:#D9A14A;stroke-width:1.25;fill:none}
.e-teal{stroke:#34B38A;stroke-width:1.25;fill:none}
</style>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B93A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D9A14A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#34B38A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="amber-r" x="8" y="8" width="11" height="11" rx="2"/><text class="leg" x="24" y="18">password</text>
<rect class="teal-r" x="96" y="8" width="11" height="11" rx="2"/><text class="leg" x="112" y="18">session only</text>
<rect class="gray-r" x="204" y="8" width="11" height="11" rx="2"/><text class="leg" x="220" y="18">neither</text>

<rect class="amber-r" x="12" y="40" width="196" height="64" rx="8"/>
<text class="t amber-t" x="110" y="64" text-anchor="middle">You, once</text>
<text class="s" x="110" y="84" text-anchor="middle">own terminal, no echo</text>
<line class="e-amber" x1="110" y1="104" x2="110" y2="129" marker-end="url(#ma)"/>

<rect class="amber-r" x="12" y="132" width="196" height="64" rx="8"/>
<text class="t amber-t" x="110" y="156" text-anchor="middle">OS credential store</text>
<text class="s" x="110" y="176" text-anchor="middle">Keychain and friends</text>
<line class="e-amber" x1="110" y1="196" x2="110" y2="221" marker-end="url(#ma)"/>

<rect class="amber-r" x="12" y="224" width="196" height="64" rx="8"/>
<text class="t amber-t" x="110" y="248" text-anchor="middle">Dev server</text>
<text class="teal-note" x="110" y="268" text-anchor="middle">logs in, caches session</text>

<rect class="gray-r" x="240" y="224" width="96" height="64" rx="8"/>
<text class="t gray-t" x="288" y="248" text-anchor="middle">Backend</text>
<text class="s" x="288" y="268" text-anchor="middle">login API</text>
<line class="e-amber" x1="208" y1="246" x2="237" y2="246" marker-end="url(#ma)"/>
<line class="e-teal" x1="240" y1="268" x2="211" y2="268" marker-end="url(#mt)"/>

<line class="e-teal" x1="110" y1="288" x2="110" y2="313" marker-end="url(#mt)"/>

<rect class="teal-r" x="12" y="316" width="196" height="64" rx="8"/>
<text class="t teal-t" x="110" y="340" text-anchor="middle">Browser</text>
<text class="s" x="110" y="360" text-anchor="middle">token set before boot</text>

<line class="e-gray" x1="110" y1="408" x2="110" y2="383" marker-end="url(#mg)"/>
<rect class="gray-r" x="12" y="408" width="196" height="64" rx="8"/>
<text class="t gray-t" x="110" y="432" text-anchor="middle">Coding agent</text>
<text class="s" x="110" y="452" text-anchor="middle">opens localhost</text>

<text class="note" x="8" y="504">The password stops at the dev server.</text>
<text class="note" x="8" y="522">The browser and agent only see the session.</text>
</svg>
