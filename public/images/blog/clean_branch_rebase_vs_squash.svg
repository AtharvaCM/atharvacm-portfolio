<svg width="100%" viewBox="0 0 680 246" role="img" xmlns="http://www.w3.org/2000/svg">
<title>With clean commits, rebase keeps three readable steps on main while squash collapses them into one</title>
<desc>A branch whose three commits each do one thing. Rebased, git blame points at a single commit touching 1 file and 12 lines. Squashed, it points at the whole pull request: 9 files and 240 lines.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.lane{font-size:12px;fill:#8B93A1;font-weight:600;letter-spacing:.03em}
.msg{font-size:12.5px;font-weight:600}
.msg-sm{font-size:11.5px;font-weight:600}
.sha{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px}
.note{font-size:11.5px;fill:#A3AAB6}
.teal-note{font-size:11.5px;fill:#5FCBA3}
.ghost-note{font-size:11.5px;fill:#7D8594}
.coral-note{font-size:11.5px;fill:#F0A088}
.pill{font-size:11px;font-weight:600}
.rowlab{font-size:12px;font-weight:700;fill:#E1E4EA;letter-spacing:.04em}
.q{font-size:13.5px;fill:#E1E4EA;font-weight:600}
.qsub{font-size:11.5px;fill:#A3AAB6}
.ans{font-size:13.5px;fill:#F1EBE3;font-weight:700}
.anssub{font-size:11.5px;fill:#A3AAB6}
.branch{font-size:11.5px;fill:#A3AAB6;font-weight:600}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.branch-r{fill:#161A22;stroke:#A3AAB6;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.amber-r{fill:#3A2A10;stroke:#D9A14A;stroke-width:1}
.coral-r{fill:#3B1E17;stroke:#E2795A;stroke-width:1}
.ghost-r{fill:none;stroke:#4B5362;stroke-width:1;stroke-dasharray:4 3}
.q-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.a-r{fill:#1C212B;stroke:#8B93A1;stroke-width:1}
.gray-t{fill:#E1E4EA}.gray-s{fill:#8B93A1}
.teal-t{fill:#8FE3C4}.teal-s{fill:#5FCBA3}
.amber-t{fill:#F2C879}.amber-s{fill:#D9A14A}
.coral-t{fill:#F0A088}
.ghost-t{fill:#7D8594}
.edge{stroke:#4B5362;stroke-width:1;fill:none}
.edge-strong{stroke:#8B93A1;stroke-width:1.25;fill:none}
.coral-edge{stroke:#E2795A;stroke-width:1;fill:none}
.funnel{fill:#34B38A;fill-opacity:.14;stroke:#34B38A;stroke-width:.6}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B93A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6A7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E2795A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="rowlab" x="8" y="30">REBASE AND MERGE</text>
<rect class="gray-r" x="8" y="44" width="86" height="44" rx="8"/>
<text class="msg gray-t" x="51" y="62" text-anchor="middle">main</text>
<text class="sha gray-s" x="51" y="78" text-anchor="middle">2c4d6e8</text>
<line class="edge" x1="94" y1="66" x2="104" y2="66"/>
<rect class="teal-r" x="104" y="44" width="150" height="44" rx="8"/>
<text class="msg teal-t" x="179" y="62" text-anchor="middle">add retry helper</text>
<text class="sha teal-s" x="179" y="78" text-anchor="middle">4b1e0a2</text>
<line class="edge" x1="254" y1="66" x2="264" y2="66"/>
<rect class="teal-r" x="264" y="44" width="150" height="44" rx="8"/>
<text class="msg teal-t" x="339" y="62" text-anchor="middle">wire up checkout</text>
<text class="sha teal-s" x="339" y="78" text-anchor="middle">9c3f7d1</text>
<line class="edge" x1="414" y1="66" x2="424" y2="66"/>
<rect class="teal-r" x="424" y="44" width="150" height="44" rx="8"/>
<text class="msg teal-t" x="499" y="62" text-anchor="middle">test retry path</text>
<text class="sha teal-s" x="499" y="78" text-anchor="middle">e2a85b6</text>
<circle cx="112" cy="108" r="3.5" fill="#34B38A"/>
<text class="note" x="124" y="112">blame on a retry line points at “wire up checkout”: 1 file, 12 lines</text>
<text class="rowlab" x="8" y="150">SQUASH AND MERGE</text>
<rect class="gray-r" x="8" y="164" width="86" height="44" rx="8"/>
<text class="msg gray-t" x="51" y="182" text-anchor="middle">main</text>
<text class="sha gray-s" x="51" y="198" text-anchor="middle">2c4d6e8</text>
<line class="edge" x1="94" y1="186" x2="104" y2="186"/>
<rect class="teal-r" x="104" y="164" width="150" height="44" rx="8"/>
<text class="msg teal-t" x="179" y="182" text-anchor="middle">retry checkout (#143)</text>
<text class="sha teal-s" x="179" y="198" text-anchor="middle">5f0d9c4</text>
<rect class="ghost-r" x="274" y="164" width="230" height="44" rx="8"/>
<text class="ghost-note" x="389" y="181" text-anchor="middle">the same three steps,</text>
<text class="ghost-note" x="389" y="197" text-anchor="middle">readable only inside PR #143</text>
<circle cx="112" cy="228" r="3.5" fill="#E2795A"/>
<text class="note" x="124" y="232">blame on the same line points at the whole pull request: 9 files, 240 lines</text>
</svg>
