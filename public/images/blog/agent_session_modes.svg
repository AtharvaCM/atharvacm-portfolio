<svg width="100%" viewBox="0 0 680 290" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Two modes: a dev server for local code, a proxy for the deployed build</title>
<desc>In serve mode, the local Vite dev server runs your frontend code, injects the session and forwards API calls to the VM's backend. In proxy mode, a small Node reverse proxy on localhost forwards everything to the build deployed on the VM and injects the session into HTML responses only.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.t{font-size:14px;font-weight:600}
.s{font-size:12.5px;fill:#C3C9D3}
.leg{font-size:12.5px;fill:#C3C9D3}
.note{font-size:12.5px;fill:#C3C9D3}
.rowlab{font-size:13.5px;font-weight:700;fill:#E1E4EA}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.gray-t{fill:#E1E4EA}.teal-t{fill:#8FE3C4}
.e-gray{stroke:#8B93A1;stroke-width:1.25;fill:none}
</style>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B93A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="teal-r" x="8" y="10" width="12" height="12" rx="2"/><text class="leg" x="26" y="20">injects the session</text>
<rect class="gray-r" x="168" y="10" width="12" height="12" rx="2"/><text class="leg" x="186" y="20">unchanged</text>

<text class="rowlab" x="8" y="54"><tspan class="mono">serve &lt;app&gt;</tspan><tspan class="s" font-weight="400">  local frontend code against the VM's backend</tspan></text>
<rect class="gray-r" x="8" y="66" width="150" height="70" rx="8"/>
<text class="t gray-t" x="83" y="96" text-anchor="middle">Browser</text>
<text class="s mono" x="83" y="116" text-anchor="middle">localhost</text>
<rect class="teal-r" x="196" y="66" width="240" height="70" rx="8"/>
<text class="t teal-t" x="316" y="90" text-anchor="middle">Vite dev server</text>
<text class="s" x="316" y="108" text-anchor="middle">serves your local code</text>
<text class="s" x="316" y="124" text-anchor="middle">injects session, proxies the API</text>
<rect class="gray-r" x="474" y="66" width="198" height="70" rx="8"/>
<text class="t gray-t" x="573" y="96" text-anchor="middle">Dev VM</text>
<text class="s" x="573" y="116" text-anchor="middle">backend API only</text>
<line class="e-gray" x1="158" y1="101" x2="193" y2="101" marker-end="url(#mg)"/>
<line class="e-gray" x1="436" y1="101" x2="471" y2="101" marker-end="url(#mg)"/>

<text class="rowlab" x="8" y="174"><tspan class="mono">proxy</tspan><tspan class="s" font-weight="400">  the build that is deployed on the VM</tspan></text>
<rect class="gray-r" x="8" y="186" width="150" height="70" rx="8"/>
<text class="t gray-t" x="83" y="216" text-anchor="middle">Browser</text>
<text class="s mono" x="83" y="236" text-anchor="middle">localhost</text>
<rect class="teal-r" x="196" y="186" width="240" height="70" rx="8"/>
<text class="t teal-t" x="316" y="210" text-anchor="middle">Reverse proxy (Node)</text>
<text class="s" x="316" y="228" text-anchor="middle">passes everything through</text>
<text class="s" x="316" y="244" text-anchor="middle">injects into HTML responses only</text>
<rect class="gray-r" x="474" y="186" width="198" height="70" rx="8"/>
<text class="t gray-t" x="573" y="216" text-anchor="middle">Dev VM</text>
<text class="s" x="573" y="236" text-anchor="middle">deployed frontend and API</text>
<line class="e-gray" x1="158" y1="221" x2="193" y2="221" marker-end="url(#mg)"/>
<line class="e-gray" x1="436" y1="221" x2="471" y2="221" marker-end="url(#mg)"/>

<text class="note" x="340" y="280" text-anchor="middle">Either way, the agent opens localhost and finds itself already logged in.</text>
</svg>
