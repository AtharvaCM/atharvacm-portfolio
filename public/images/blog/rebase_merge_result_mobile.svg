<svg width="100%" viewBox="0 0 344 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Rebase: each branch commit is copied onto main with the same message and a new SHA</title>
<desc>Main gains three commits, one per original. Each copy keeps its message and author but gets a new hash because its parent changed. The originals stay on the branch.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.lane{font-size:11px;fill:#8B93A1;font-weight:600;letter-spacing:0}
.msg{font-size:13px;font-weight:600}
.msg-sm{font-size:11.5px;font-weight:600}
.sha{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.note{font-size:11.5px;fill:#A3AAB6}
.teal-note{font-size:11.5px;fill:#5FCBA3}
.ghost-note{font-size:11.5px;fill:#7D8594}
.coral-note{font-size:11.5px;fill:#F0A088}
.pill{font-size:11px;font-weight:600}
.rowlab{font-size:12px;font-weight:700;fill:#E1E4EA;letter-spacing:.04em}
.q{font-size:13px;fill:#E1E4EA;font-weight:600}
.qsub{font-size:11.5px;fill:#A3AAB6}
.ans{font-size:13.5px;fill:#F1EBE3;font-weight:700}
.anssub{font-size:11.5px;fill:#A3AAB6}
.branch{font-size:11.5px;fill:#A3AAB6;font-weight:600}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.branch-r{fill:#161A22;stroke:#A3AAB6;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.amber-r{fill:#3A2A10;stroke:#D9A14A;stroke-width:1}
.coral-r{fill:#3B1E17;stroke:#E2795A;stroke-width:1}
.ghost-r{fill:none;stroke:#4B5362;stroke-width:1;stroke-dasharray:4 3}
.q-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.a-r{fill:#1C212B;stroke:#8B93A1;stroke-width:1}
.gray-t{fill:#E1E4EA}.gray-s{fill:#8B93A1}
.teal-t{fill:#8FE3C4}.teal-s{fill:#5FCBA3}
.amber-t{fill:#F2C879}.amber-s{fill:#D9A14A}
.coral-t{fill:#F0A088}
.ghost-t{fill:#7D8594}
.edge{stroke:#4B5362;stroke-width:1;fill:none}
.edge-strong{stroke:#8B93A1;stroke-width:1.25;fill:none}
.coral-edge{stroke:#E2795A;stroke-width:1;fill:none}
.funnel{fill:#34B38A;fill-opacity:.14;stroke:#34B38A;stroke-width:.6}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B93A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6A7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E2795A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="lane" x="12" y="26">main</text>
<text class="lane" x="198" y="26">feature/checkout-retry</text>
<rect class="gray-r" x="12" y="40" width="130" height="40" rx="8"/>
<text class="msg gray-t" x="77" y="57" text-anchor="middle">earlier work</text>
<text class="sha gray-s" x="77" y="72" text-anchor="middle">9f8e7d6</text>
<line class="edge" x1="77" y1="80" x2="77" y2="96"/>
<rect class="gray-r" x="12" y="96" width="130" height="40" rx="8"/>
<text class="msg gray-t" x="77" y="113" text-anchor="middle">fix: empty cart</text>
<text class="sha gray-s" x="77" y="128" text-anchor="middle">2c4d6e8</text>
<line class="edge" x1="77" y1="136" x2="77" y2="152"/>
<rect class="teal-r" x="12" y="152" width="130" height="40" rx="8"/>
<text class="msg teal-t" x="77" y="169" text-anchor="middle">wip</text>
<text class="sha coral-t" x="77" y="184" text-anchor="middle">a1b2c3d'</text>
<line class="edge" x1="77" y1="192" x2="77" y2="208"/>
<rect class="teal-r" x="12" y="208" width="130" height="40" rx="8"/>
<text class="msg teal-t" x="77" y="225" text-anchor="middle">fix typo</text>
<text class="sha coral-t" x="77" y="240" text-anchor="middle">e4f5a6b'</text>
<line class="edge" x1="77" y1="248" x2="77" y2="264"/>
<rect class="teal-r" x="12" y="264" width="130" height="40" rx="8"/>
<text class="msg teal-t" x="77" y="281" text-anchor="middle">feat: retry</text>
<text class="sha coral-t" x="77" y="296" text-anchor="middle">b7c8d9e'</text>
<path class="edge" d="M142 60 H 251 Q263 60 263 72 V 96"/>
<rect class="ghost-r" x="198" y="96" width="130" height="40" rx="8"/>
<text class="msg ghost-t" x="263" y="113" text-anchor="middle">wip</text>
<text class="sha ghost-t" x="263" y="128" text-anchor="middle">a1b2c3d</text>
<line class="edge" x1="263" y1="136" x2="263" y2="152"/>
<rect class="ghost-r" x="198" y="152" width="130" height="40" rx="8"/>
<text class="msg ghost-t" x="263" y="169" text-anchor="middle">fix typo</text>
<text class="sha ghost-t" x="263" y="184" text-anchor="middle">e4f5a6b</text>
<line class="edge" x1="263" y1="192" x2="263" y2="208"/>
<rect class="ghost-r" x="198" y="208" width="130" height="40" rx="8"/>
<text class="msg ghost-t" x="263" y="225" text-anchor="middle">feat: retry</text>
<text class="sha ghost-t" x="263" y="240" text-anchor="middle">b7c8d9e</text>
<path class="edge" d="M198 116 C 172 116, 172 172, 146 172" marker-end="url(#af)"/>
<path class="edge" d="M198 172 C 172 172, 172 228, 146 228" marker-end="url(#af)"/>
<path class="edge" d="M198 228 C 172 228, 172 284, 146 284" marker-end="url(#af)"/>
<text class="ghost-note" x="198" y="270">originals stay</text>
<text class="ghost-note" x="198" y="286">on your branch</text>
<text class="ghost-note" x="198" y="302">and in PR #142</text>
<rect class="teal-r" x="12" y="320" width="176" height="22" rx="11"/>
<text class="pill teal-t" x="100" y="335" text-anchor="middle">same message and author</text>
<text class="coral-note" x="12" y="366">parent is now 2c4d6e8,</text>
<text class="coral-note" x="12" y="382">so every hash changes</text>
<rect class="gray-r" x="12" y="400" width="12" height="12" rx="3"/>
<text class="note" x="30" y="410">already on main</text>
<rect class="teal-r" x="12" y="418" width="12" height="12" rx="3"/>
<text class="note" x="30" y="428">lands on main</text>
<text class="sha coral-t" x="12" y="446">abc'</text>
<text class="note" x="46" y="446">new SHA</text>
<rect class="ghost-r" x="12" y="454" width="12" height="12" rx="3"/>
<text class="note" x="30" y="464">exists, but not on main</text>
</svg>
