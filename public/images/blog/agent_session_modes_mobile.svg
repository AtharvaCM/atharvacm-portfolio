<svg width="100%" viewBox="0 0 344 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Two modes: a dev server for local code, a proxy for the deployed build</title>
<desc>In serve mode, the local Vite dev server runs your frontend code, injects the session and forwards API calls to the VM's backend. In proxy mode, a small Node reverse proxy on localhost forwards everything to the build deployed on the VM and injects the session into HTML responses only.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.t{font-size:15px;font-weight:600}
.s{font-size:14px;fill:#C3C9D3}
.leg{font-size:13px;fill:#C3C9D3}
.note{font-size:14px;fill:#C3C9D3}
.rowlab{font-size:14.5px;font-weight:700;fill:#E1E4EA}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.gray-t{fill:#E1E4EA}.teal-t{fill:#8FE3C4}
.e-gray{stroke:#8B93A1;stroke-width:1.25;fill:none}
</style>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B93A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="teal-r" x="8" y="8" width="11" height="11" rx="2"/><text class="leg" x="24" y="18">injects the session</text>
<rect class="gray-r" x="172" y="8" width="11" height="11" rx="2"/><text class="leg" x="188" y="18">unchanged</text>

<text class="rowlab mono" x="12" y="50">serve &lt;app&gt;</text>
<text class="s" x="12" y="68">local frontend code, VM's backend</text>
<rect class="gray-r" x="12" y="80" width="320" height="52" rx="8"/>
<text class="t gray-t" x="172" y="102" text-anchor="middle">Browser</text>
<text class="s mono" x="172" y="120" text-anchor="middle">localhost</text>
<line class="e-gray" x1="172" y1="132" x2="172" y2="153" marker-end="url(#mg)"/>
<rect class="teal-r" x="12" y="156" width="320" height="52" rx="8"/>
<text class="t teal-t" x="172" y="178" text-anchor="middle">Vite dev server</text>
<text class="s" x="172" y="196" text-anchor="middle">local code, injects session, proxies API</text>
<line class="e-gray" x1="172" y1="208" x2="172" y2="229" marker-end="url(#mg)"/>
<rect class="gray-r" x="12" y="232" width="320" height="52" rx="8"/>
<text class="t gray-t" x="172" y="254" text-anchor="middle">Dev VM</text>
<text class="s" x="172" y="272" text-anchor="middle">backend API only</text>

<text class="rowlab mono" x="12" y="326">proxy</text>
<text class="s" x="12" y="344">the build deployed on the VM</text>
<rect class="gray-r" x="12" y="356" width="320" height="52" rx="8"/>
<text class="t gray-t" x="172" y="378" text-anchor="middle">Browser</text>
<text class="s mono" x="172" y="396" text-anchor="middle">localhost</text>
<line class="e-gray" x1="172" y1="408" x2="172" y2="429" marker-end="url(#mg)"/>
<rect class="teal-r" x="12" y="432" width="320" height="52" rx="8"/>
<text class="t teal-t" x="172" y="454" text-anchor="middle">Reverse proxy (Node)</text>
<text class="s" x="172" y="472" text-anchor="middle">passes through, injects into HTML only</text>
<line class="e-gray" x1="172" y1="484" x2="172" y2="505" marker-end="url(#mg)"/>
<rect class="gray-r" x="12" y="508" width="320" height="52" rx="8"/>
<text class="t gray-t" x="172" y="530" text-anchor="middle">Dev VM</text>
<text class="s" x="172" y="548" text-anchor="middle">deployed frontend and API</text>

<text class="note" x="12" y="588">Either way, the agent opens localhost.</text>
</svg>
