<svg width="100%" viewBox="0 0 344 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Merge commit: all three branch commits land on main unchanged, plus one new commit with two parents</title>
<desc>Main keeps its own commit, the branch keeps its three commits with identical SHAs, and a merge commit joins both lines.</desc>
<style>
