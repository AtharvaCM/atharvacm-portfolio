.anssub{font-size:11.5px;fill:#A3AAB6}
.branch{font-size:11.5px;fill:#A3AAB6;font-weight:600}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.branch-r{fill:#161A22;stroke:#A3AAB6;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.amber-r{fill:#3A2A10;stroke:#D9A14A;stroke-width:1}
.coral-r{fill:#3B1E17;stroke:#E2795A;stroke-width:1}
.ghost-r{fill:none;stroke:#4B5362;stroke-width:1;stroke-dasharray:4 3}
.q-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.a-r{fill:#1C212B;stroke:#8B93A1;stroke-width:1}
.gray-t{fill:#E1E4EA}.gray-s{fill:#8B93A1}
.teal-t{fill:#8FE3C4}.teal-s{fill:#5FCBA3}
.amber-t{fill:#F2C879}.amber-s{fill:#D9A14A}
