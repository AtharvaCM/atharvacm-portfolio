<text class="sha teal-s" x="263" y="240" text-anchor="middle">b7c8d9e</text>
<line class="edge-strong" x1="77" y1="136" x2="77" y2="260" marker-end="url(#a)"/>
<text class="note" x="85" y="204">parent 1 (main)</text>
<rect class="amber-r" x="12" y="264" width="130" height="40" rx="8"/>
<text class="msg amber-t" x="77" y="281" text-anchor="middle">Merge PR #142</text>
