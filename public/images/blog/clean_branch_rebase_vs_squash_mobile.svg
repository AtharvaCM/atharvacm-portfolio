<svg width="100%" viewBox="0 0 344 306" role="img" xmlns="http://www.w3.org/2000/svg">
<title>With clean commits, rebase keeps three readable steps on main while squash collapses them into one</title>
<desc>A branch whose three commits each do one thing. Rebased, git blame points at a single commit touching 1 file and 12 lines. Squashed, it points at the whole pull request: 9 files and 240 lines.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.lane{font-size:11px;fill:#8B93A1;font-weight:600;letter-spacing:0}
.msg{font-size:13px;font-weight:600}
.msg-sm{font-size:11.5px;font-weight:600}
.sha{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.note{font-size:11.5px;fill:#A3AAB6}
.teal-note{font-size:11.5px;fill:#5FCBA3}
.ghost-note{font-size:11.5px;fill:#7D8594}
.coral-note{font-size:11.5px;fill:#F0A088}
.pill{font-size:11px;font-weight:600}
.rowlab{font-size:12px;font-weight:700;fill:#E1E4EA;letter-spacing:.04em}
.q{font-size:13px;fill:#E1E4EA;font-weight:600}
.qsub{font-size:11.5px;fill:#A3AAB6}
.ans{font-size:13.5px;fill:#F1EBE3;font-weight:700}
.anssub{font-size:11.5px;fill:#A3AAB6}
.branch{font-size:11.5px;fill:#A3AAB6;font-weight:600}
.gray-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.branch-r{fill:#161A22;stroke:#A3AAB6;stroke-width:1}
.teal-r{fill:#10302A;stroke:#34B38A;stroke-width:1}
.amber-r{fill:#3A2A10;stroke:#D9A14A;stroke-width:1}
.coral-r{fill:#3B1E17;stroke:#E2795A;stroke-width:1}
.ghost-r{fill:none;stroke:#4B5362;stroke-width:1;stroke-dasharray:4 3}
.q-r{fill:#232833;stroke:#5A6374;stroke-width:1}
.a-r{fill:#1C212B;stroke:#8B93A1;stroke-width:1}
.gray-t{fill:#E1E4EA}.gray-s{fill:#8B93A1}
.teal-t{fill:#8FE3C4}.teal-s{fill:#5FCBA3}
.amber-t{fill:#F2C879}.amber-s{fill:#D9A14A}
.coral-t{fill:#F0A088}
.ghost-t{fill:#7D8594}
.edge{stroke:#4B5362;stroke-width:1;fill:none}
.edge-strong{stroke:#8B93A1;stroke-width:1.25;fill:none}
.coral-edge{stroke:#E2795A;stroke-width:1;fill:none}
.funnel{fill:#34B38A;fill-opacity:.14;stroke:#34B38A;stroke-width:.6}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B93A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6A7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E2795A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="rowlab" x="12" y="24">REBASE AND MERGE</text>
<text class="rowlab" x="178" y="24">SQUASH AND MERGE</text>
<rect class="gray-r" x="12" y="36" width="154" height="40" rx="8"/>
<text class="msg gray-t" x="89" y="53" text-anchor="middle">main</text>
<text class="sha gray-s" x="89" y="68" text-anchor="middle">2c4d6e8</text>
<line class="edge" x1="89" y1="76" x2="89" y2="88"/>
<rect class="teal-r" x="12" y="88" width="154" height="40" rx="8"/>
<text class="msg teal-t" x="89" y="105" text-anchor="middle">add retry helper</text>
<text class="sha teal-s" x="89" y="120" text-anchor="middle">4b1e0a2</text>
<line class="edge" x1="89" y1="128" x2="89" y2="140"/>
<rect class="teal-r" x="12" y="140" width="154" height="40" rx="8"/>
<text class="msg teal-t" x="89" y="157" text-anchor="middle">wire up checkout</text>
<text class="sha teal-s" x="89" y="172" text-anchor="middle">9c3f7d1</text>
<line class="edge" x1="89" y1="180" x2="89" y2="192"/>
<rect class="teal-r" x="12" y="192" width="154" height="40" rx="8"/>
<text class="msg teal-t" x="89" y="209" text-anchor="middle">test retry path</text>
<text class="sha teal-s" x="89" y="224" text-anchor="middle">e2a85b6</text>
<rect class="gray-r" x="178" y="36" width="154" height="40" rx="8"/>
<text class="msg gray-t" x="255" y="53" text-anchor="middle">main</text>
<text class="sha gray-s" x="255" y="68" text-anchor="middle">2c4d6e8</text>
<line class="edge" x1="255" y1="76" x2="255" y2="88"/>
<rect class="teal-r" x="178" y="88" width="154" height="40" rx="8"/>
<text class="msg-sm teal-t" x="255" y="105" text-anchor="middle">retry checkout (#143)</text>
<text class="sha teal-s" x="255" y="120" text-anchor="middle">5f0d9c4</text>
<rect class="ghost-r" x="178" y="140" width="154" height="92" rx="8"/>
<text class="ghost-note" x="255" y="172" text-anchor="middle">the same three steps,</text>
<text class="ghost-note" x="255" y="188" text-anchor="middle">readable only</text>
<text class="ghost-note" x="255" y="204" text-anchor="middle">inside PR #143</text>
<circle cx="18" cy="256" r="3.5" fill="#34B38A"/>
<text class="note" x="28" y="260">blame lands on</text>
<text class="note" x="28" y="276">“wire up checkout”:</text>
<text class="note" x="28" y="292">1 file, 12 lines</text>
<circle cx="184" cy="256" r="3.5" fill="#E2795A"/>
<text class="note" x="194" y="260">blame lands on</text>
<text class="note" x="194" y="276">the whole PR:</text>
<text class="note" x="194" y="292">9 files, 240 lines</text>
</svg>
